# Netlify configuration — this site is plain HTML/CSS/JS, so there is nothing
# to build. Netlify just publishes the folder as-is.

[build]
  publish = "."
  command = ""

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Pretty URLs: /work/fieldnote-provisions instead of the .html file
[[redirects]]
  from = "/work/:slug"
  to = "/work/:slug.html"
  status = 200
